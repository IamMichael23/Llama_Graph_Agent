<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golf Equipment AI Advisor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
            background: #000000;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            height: 90vh;
            background: #ffffff;
            border: 1px solid #e5e5e5;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .header {
            background: #000000;
            color: #ffffff;
            padding: 30px 40px;
            border-bottom: 1px solid #1a1a1a;
        }

        .header h1 {
            font-size: 1.8em;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: -0.02em;
        }

        .header p {
            font-size: 0.95em;
            color: #999999;
            font-weight: 400;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 30px 40px;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .message {
            display: flex;
            gap: 16px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 65%;
            padding: 14px 18px;
            border: 1px solid;
            position: relative;
            line-height: 1.6;
            font-size: 0.95em;
        }

        .message.user .message-content {
            background: #000000;
            color: #ffffff;
            border-color: #000000;
        }

        .message.agent .message-content {
            background: #ffffff;
            color: #000000;
            border-color: #e5e5e5;
        }

        .message-avatar {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2em;
            flex-shrink: 0;
            border: 1px solid #e5e5e5;
            background: #ffffff;
        }

        .message.user .message-avatar {
            background: #000000;
            border-color: #000000;
            order: 2;
        }

        .input-container {
            padding: 30px 40px;
            background: #fafafa;
            border-top: 1px solid #e5e5e5;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        #userInput {
            flex: 1;
            padding: 14px 18px;
            border: 1px solid #d0d0d0;
            font-size: 0.95em;
            outline: none;
            transition: all 0.2s ease;
            background: #ffffff;
            color: #000000;
            font-family: inherit;
        }

        #userInput:focus {
            border-color: #000000;
        }

        #userInput::placeholder {
            color: #999999;
        }

        button {
            padding: 14px 24px;
            border: 1px solid;
            font-size: 0.95em;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
            font-family: inherit;
            background: none;
        }

        #sendBtn {
            background: #000000;
            color: #ffffff;
            border-color: #000000;
        }

        #sendBtn:hover:not(:disabled) {
            background: #1a1a1a;
        }

        #sendBtn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #clearBtn {
            background: #ffffff;
            color: #000000;
            border-color: #d0d0d0;
        }

        #clearBtn:hover {
            border-color: #000000;
        }

        .tool-indicator {
            display: none;
            padding: 14px 18px;
            background: #fafafa;
            border: 1px solid #e5e5e5;
            width: fit-content;
            color: #666666;
            font-size: 0.9em;
        }

        .tool-indicator.active {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .tool-icon {
            font-size: 1.1em;
            animation: rotate 2s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            color: #666666;
            padding: 60px 20px;
        }

        .empty-state h3 {
            font-size: 1.5em;
            margin-bottom: 12px;
            color: #000000;
            font-weight: 600;
        }

        .empty-state p {
            color: #999999;
            font-size: 0.95em;
        }

        .suggestion-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-top: 24px;
        }

        .chip {
            background: #ffffff;
            padding: 10px 18px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid #d0d0d0;
            font-size: 0.9em;
            color: #666666;
        }

        .chip:hover {
            background: #000000;
            color: #ffffff;
            border-color: #000000;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f5f5f5;
        }

        ::-webkit-scrollbar-thumb {
            background: #d0d0d0;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #000000;
        }

        @media (max-width: 768px) {
            .container {
                height: 100vh;
                border-radius: 0;
            }

            .header h1 {
                font-size: 1.4em;
            }

            .message-content {
                max-width: 80%;
            }

            .chat-container {
                padding: 20px;
            }

            .input-container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Golf Equipment AI Advisor</h1>
            <p>Expert recommendations for your perfect golf club fitting</p>
        </div>

        <div class="chat-container" id="chatContainer">
            <div class="empty-state" id="emptyState">
                <h3>Welcome</h3>
                <p>Ask me anything about golf club fitting, swing speed recommendations, or equipment selection.</p>
                <div class="suggestion-chips">
                    <div class="chip" onclick="sendSuggestion('What driver specs for 95 mph swing speed?')">
                        Driver for 95 mph swing
                    </div>
                    <div class="chip" onclick="sendSuggestion('I need help choosing a driver')">
                        Need a new driver
                    </div>
                    <div class="chip" onclick="sendSuggestion('Best shaft flex for senior golfer?')">
                        Senior golfer recommendations
                    </div>
                    <div class="chip" onclick="sendSuggestion('Low spin driver for high swing speed')">
                        Low spin options
                    </div>
                </div>
            </div>
            <div class="tool-indicator" id="toolIndicator">
                <span class="tool-icon">⚙</span>
                <span id="toolStatus">Processing...</span>
            </div>
        </div>

        <div class="input-container">
            <button id="clearBtn" onclick="clearChat()">Clear</button>
            <input
                type="text"
                id="userInput"
                placeholder="Ask about golf equipment, fitting, or recommendations..."
                onkeypress="handleKeyPress(event)"
            >
            <button id="sendBtn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chatContainer');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const toolIndicator = document.getElementById('toolIndicator');
        const toolStatus = document.getElementById('toolStatus');
        const emptyState = document.getElementById('emptyState');

        const toolMessages = [
            '⚙ Searching fitting instructions...',
            '⚙ Analyzing swing data...',
            '⚙ Retrieving product recommendations...',
            '⚙ Matching specifications...',
            '⚙ Formulating response...'
        ];

        let toolMessageIndex = 0;
        let toolInterval = null;

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        function sendSuggestion(message) {
            userInput.value = message;
            sendMessage();
        }

        function updateToolStatus() {
            toolStatus.textContent = toolMessages[toolMessageIndex];
            toolMessageIndex = (toolMessageIndex + 1) % toolMessages.length;
        }

        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;

            if (emptyState) {
                emptyState.style.display = 'none';
            }

            addMessage(message, 'user');
            userInput.value = '';
            sendBtn.disabled = true;

            toolIndicator.classList.add('active');
            toolMessageIndex = 0;
            updateToolStatus();
            toolInterval = setInterval(updateToolStatus, 2000);
            scrollToBottom();

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ message: message })
                });

                const data = await response.json();

                clearInterval(toolInterval);
                toolIndicator.classList.remove('active');

                if (response.ok) {
                    addMessage(data.response, 'agent');
                } else {
                    addMessage('Sorry, I encountered an error. Please try again.', 'agent');
                }
            } catch (error) {
                console.error('Error:', error);
                clearInterval(toolInterval);
                toolIndicator.classList.remove('active');
                addMessage('Sorry, I couldn\'t connect to the server. Please try again.', 'agent');
            } finally {
                sendBtn.disabled = false;
                userInput.focus();
            }
        }

        function addMessage(content, role) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;

            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.textContent = role === 'user' ? '👤' : '🤖';

            const messageContent = document.createElement('div');
            messageContent.className = 'message-content';
            messageContent.textContent = content;

            messageDiv.appendChild(avatar);
            messageDiv.appendChild(messageContent);

            chatContainer.insertBefore(messageDiv, toolIndicator);
            scrollToBottom();
        }

        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function clearChat() {
            if (!confirm('Are you sure you want to clear the chat history?')) {
                return;
            }

            try {
                await fetch('/api/clear', {
                    method: 'POST'
                });

                const messages = chatContainer.querySelectorAll('.message');
                messages.forEach(msg => msg.remove());

                if (emptyState) {
                    emptyState.style.display = 'block';
                }
            } catch (error) {
                console.error('Error clearing chat:', error);
            }
        }

        async function loadHistory() {
            try {
                const response = await fetch('/api/history');
                const data = await response.json();

                if (data.history && data.history.length > 0) {
                    emptyState.style.display = 'none';
                    data.history.forEach(msg => {
                        addMessage(msg.content, msg.role);
                    });
                }
            } catch (error) {
                console.error('Error loading history:', error);
            }
        }

        window.onload = () => {
            userInput.focus();
            loadHistory();
        };
    </script>
</body>
</html>
